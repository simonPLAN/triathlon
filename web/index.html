<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#163C73">
  <meta name="description" content="Le Mans Triathlon Series : compétitions, épreuves, manches, groupes et résultats pour les coachs et les athlètes.">
  <meta name="apple-mobile-web-app-title" content="LMTS">
  <link rel="icon" type="image/svg+xml" href="icons/lmts.svg">
  <link rel="manifest" href="manifest.json">
  <title>Le Mans Triathlon Series</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f5f7fb;font-family:system-ui,sans-serif;color:#163c73}
    #chargement{position:fixed;inset:0;display:grid;place-content:center;text-align:center;padding:24px}
    #chargement img{width:180px;margin:0 auto 24px}
    #chargement h1{font-size:clamp(22px,4vw,32px);margin:0 0 12px}
    #chargement p{color:#536176;line-height:1.6}
    #chargement a{color:#163c73}
  </style>
</head>
<body>
  <div id="chargement" role="status" aria-live="polite">
    <img src="icons/lmts.svg" alt="" width="180" height="180">
    <h1>Le Mans Triathlon Series</h1>
    <p id="message-demarrage">Chargement de votre espace sportif…</p>
  </div>
  <noscript>Activez JavaScript pour accéder aux compétitions et aux résultats.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('chargement')?.remove();
    });
    window.addEventListener('error', function (event) {
      if (event.target instanceof HTMLScriptElement) {
        document.getElementById('message-demarrage').textContent =
          'Le chargement a échoué. Vérifiez votre connexion puis rechargez la page.';
      }
    }, true);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
